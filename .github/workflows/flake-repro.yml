# TEMPORARY: repeats run-shell.test.ts on Windows to measure flakiness. Remove before merge.
name: run-shell flake repro
on:
  push:
    branches: [fix/run-shell-ebusy-flake]
jobs:
  repeat:
    name: Repeat run-shell (shard ${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the file 6 x 2 concurrent copies
        shell: bash
        run: |
          pass=0; fail=0
          for i in 1 2 3 4 5 6; do
            for c in a b; do
              (pnpm exec vitest run src/main/tools/run-shell.test.ts > "out-$i-$c.log" 2>&1; echo $? > "rc-$i-$c") &
            done
            wait
            for c in a b; do
              if [ "$(cat rc-$i-$c)" = 0 ]; then pass=$((pass+1)); else fail=$((fail+1)); echo "::group::FAILED run $i$c"; cat "out-$i-$c.log"; echo "::endgroup::"; fi
              grep -h "TEMPDIAG\|DIAG root" "out-$i-$c.log" | sed "s/^/[$i$c] /" | cut -c1-600 || true
              grep -h "PowerShell fallback when taskkill" "out-$i-$c.log" | sed "s/^/[$i$c] /" || true
            done
          done
          echo "RESULT shard ${{ matrix.shard }}: pass=$pass fail=$fail"
          [ "$fail" = 0 ]
