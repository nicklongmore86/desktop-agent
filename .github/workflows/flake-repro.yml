# TEMPORARY: repeats run-shell.test.ts on Windows to measure flakiness. Remove before merge.
name: run-shell flake repro
on:
  push:
    branches: [fix/run-shell-ebusy-flake]
jobs:
  repeat:
    name: Repeat run-shell (shard ${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the full suite 6 times (realistic load)
        shell: bash
        run: |
          pass=0; fail=0
          for i in 1 2 3 4 5 6; do
            if pnpm test > "out-$i.log" 2>&1; then pass=$((pass+1)); else fail=$((fail+1)); echo "::group::FAILED run $i"; cat "out-$i.log"; echo "::endgroup::"; fi
            grep -h "DIAG root\|survivors\|PowerShell fallback when taskkill cannot start\|Tests  " "out-$i.log" | sed "s/^/[$i] /" | cut -c1-600 || true
          done
          echo "RESULT shard ${{ matrix.shard }}: pass=$pass fail=$fail"
          [ "$fail" = 0 ]
