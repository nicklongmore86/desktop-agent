name: CI

# Windows minutes cost more than Linux, so Windows only runs when it matters. See docs/ci.md.
on:
  push:
    branches: [main]
    # Keep in sync with ci-docs.yml.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.polly/**'
      - 'LICENSE*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.polly/**'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the outdated run on the same branch/PR; runs on main always finish.
# Labelling a PR with anything but `windows-ci` (or labelling a draft) runs nothing, so it gets
# a group of its own and never cancels a real run.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
    github.event.action == 'labeled'
    && (github.event.label.name != 'windows-ci' || github.event.pull_request.draft)
    && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Keep in sync with "engines" in package.json. pnpm comes from "packageManager".
  NODE_VERSION: 24.18.1

jobs:
  check:
    name: Check (${{ matrix.os }})
    # Skip labelling events that don't ask for Windows CI.
    if: >-
      github.event.action != 'labeled'
      || (github.event.label.name == 'windows-ci' && !github.event.pull_request.draft)
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        # Windows: pushes to main, manual runs, and non-draft PRs labelled `windows-ci` or just
        # marked ready for review. Keep in sync with the installer job's `if`.
        os: >-
          ${{ fromJSON(
          (github.event_name != 'pull_request'
          || (!github.event.pull_request.draft
          && (contains(github.event.pull_request.labels.*.name, 'windows-ci')
          || github.event.action == 'ready_for_review')))
          && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # job-run.exe and heif-decode.exe (MSVC, Windows only; a no-op on Linux), before the
      # tests that run them and before the build that compiles in their pins.
      - run: pnpm build:helpers
      - run: pnpm test
      - run: pnpm build
      # Real Electron/Chromium rendering of adversarial approval prompts (e2e/), on the built renderer.
      - name: Approval dialog rendering (Electron)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e
      # The runner's 1024x768 display would clamp the 1280px window.
      - name: Raise the display resolution
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Approval dialog rendering (Electron)
        if: runner.os != 'Linux'
        run: pnpm test:e2e
      - name: Upload approval dialog screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approval-dialog-screenshots-${{ matrix.os }}
          path: |
            e2e-artifacts/
            test-results/e2e/
          if-no-files-found: warn
          retention-days: ${{ github.ref == 'refs/heads/main' && 5 || 3 }}

  installer:
    name: Windows installer
    # Same condition as the Windows check above.
    if: >-
      github.event_name != 'pull_request'
      || (!github.event.pull_request.draft
      && (contains(github.event.pull_request.labels.*.name, 'windows-ci')
      || github.event.action == 'ready_for_review'))
    runs-on: windows-latest
    timeout-minutes: 45
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:helpers
      - run: pnpm build
      - run: pnpm exec electron-builder --win nsis --x64 --publish never
        env:
          # Unsigned for now: stop electron-builder looking for a signing certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged runtime discovery and isolation
        shell: pwsh
        run: |
          $env:DESKTOP_TEST_RESOURCES = (Resolve-Path 'release/0.1.0/win-unpacked/resources').Path
          pnpm exec vitest run src/main/providers/native.test.ts src/main/providers/codex-tools-native.test.ts
      - name: Test packaged job-run.exe
        shell: pwsh
        run: |
          $env:DESKTOP_TEST_RESOURCES = (Resolve-Path 'release/0.1.0/win-unpacked/resources').Path
          pnpm exec vitest run src/main/tools/job-run.test.ts -t 'packaged job-run.exe'
      - name: Test packaged heif-decode.exe
        shell: pwsh
        run: |
          $env:DESKTOP_TEST_RESOURCES = (Resolve-Path 'release/0.1.0/win-unpacked/resources').Path
          pnpm exec vitest run src/main/documents/heif-decode.test.ts -t 'packaged heif-decode.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-agent-windows-x64
          path: |
            release/*/*.exe
            release/*/win-unpacked/resources/runtimes/integrity.json
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 5 || 3 }}
