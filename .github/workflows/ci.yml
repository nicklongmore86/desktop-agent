name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with "engines" in package.json. pnpm comes from "packageManager".
  NODE_VERSION: 24.18.1

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      # Real Electron/Chromium rendering of adversarial approval prompts (e2e/), on the built renderer.
      - name: Approval dialog rendering (Electron)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e
      # The runner's 1024x768 display would clamp the 1280px window.
      - name: Raise the display resolution
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Approval dialog rendering (Electron)
        if: runner.os != 'Linux'
        run: pnpm test:e2e
      - name: Upload approval dialog screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approval-dialog-screenshots-${{ matrix.os }}
          path: |
            e2e-artifacts/
            test-results/e2e/
          if-no-files-found: warn
          retention-days: 14

  installer:
    name: Windows installer
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec electron-builder --win nsis --x64 --publish never
        env:
          # Unsigned for now: stop electron-builder looking for a signing certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged runtime discovery and isolation
        shell: pwsh
        run: |
          $env:DESKTOP_TEST_RESOURCES = (Resolve-Path 'release/0.1.0/win-unpacked/resources').Path
          pnpm exec vitest run src/main/providers/native.test.ts src/main/providers/codex-tools-native.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-agent-windows-x64
          path: |
            release/*/*.exe
            release/*/win-unpacked/resources/runtimes/integrity.json
          if-no-files-found: error
          retention-days: 14
