name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with "engines" in package.json. pnpm comes from "packageManager".
  NODE_VERSION: 24.18.1

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  installer:
    name: Windows installer
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec electron-builder --win nsis --x64 --publish never
        env:
          # Unsigned for now: stop electron-builder looking for a signing certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged runtime discovery and isolation
        shell: pwsh
        run: |
          $env:DESKTOP_TEST_RESOURCES = (Resolve-Path 'release/0.1.0/win-unpacked/resources').Path
          pnpm exec vitest run src/main/providers/native.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-agent-windows-x64
          path: |
            release/*/*.exe
            release/*/win-unpacked/resources/runtimes/integrity.json
          if-no-files-found: error
          retention-days: 14
