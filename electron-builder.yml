# electron-builder config: https://www.electron.build/configuration
appId: com.nicklongmore86.desktopagent
productName: Desktop Agent
copyright: Copyright © 2026 Nick Longmore

directories:
  output: release/${version}
  buildResources: build

# Only the compiled app goes into app.asar; the renderer bundles its own deps. out/ includes
# the sandboxed document worker (out/document-worker: page, PDFium WASM, its licenses).
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-win32-x64/**
beforePack: ./scripts/runtime-bundle.mjs
afterPack: ./scripts/verify-runtime-bundle.mjs
extraResources:
  - from: build/runtime-bundle
    to: runtimes
    filter: ['**/*']
  # job-run.exe, built by `pnpm build:helpers`; checked against its pin after packing.
  - from: build/helpers
    to: helpers
    filter: ['job-run.exe']
  # This project's own license; third-party notices are staged under runtimes/notices.
  - from: LICENSE
    to: LICENSE
  - from: NOTICE
    to: NOTICE

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Desktop-Agent-Setup-${version}-${arch}.${ext}
  # No code signing yet (see README). Windows SmartScreen will warn on install.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Desktop Agent
  uninstallDisplayName: Desktop Agent

publish: null
