<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Only this page's own bundled script may run; nothing may be fetched. The WASM
         compiler needs 'wasm-unsafe-eval'; its bytes arrive over the MessagePort. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'"
    />
    <title>Document worker</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body></body>
</html>
